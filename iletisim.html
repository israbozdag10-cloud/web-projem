<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Web Projem</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
        body { background-color: #f4f7f6; }
        .contact-container { background: white; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        .error-msg { color: #e50914; font-size: 0.85rem; margin-top: 5px; }
        .is-invalid { border-color: #e50914 !important; }
    </style>
</head>
<body>

    
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand text-danger fw-bold" href="#">PROJE</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" href="index.html">Hakkında</a>
                <a class="nav-link" href="cv.html">CV</a>
                <a class="nav-link" href="sehrim.html">Şehrim</a>
                <a class="nav-link" href="mirasimiz.html">Mirasımız</a>
                <a class="nav-link" href="ilgi.html">İlgi Alanlarım</a>
                <a class="nav-link active" href="iletisim.html">İletişim</a>
                <a class="nav-link" href="login.html">Login</a>
            </div>
        </div>
    </nav>

    <div id="app" class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8 contact-container p-5">
                <h2 class="text-center mb-4">İletişim Formu</h2>
                
                <form id="contactForm" action="gonder.php" method="POST" @submit="validateVue">
                    
                    <div class="mb-3">
                        <label class="form-label">Adınız Soyadınız</label>
                        <input type="text" name="adSoyad" id="adSoyad" v-model="form.name" class="form-control" :class="{'is-invalid': errors.name}">
                        <div class="error-msg" v-if="errors.name">{{ errors.name }}</div>
                    </div>

                    
                    <div class="mb-3">
                        <label class="form-label">E-posta Adresiniz</label>
                        <input type="email" name="email" id="email" v-model="form.email" class="form-control" :class="{'is-invalid': errors.email}">
                        <div class="error-msg" v-if="errors.email">{{ errors.email }}</div>
                    </div>

                   
<div class="mb-3">
    <label class="form-label">Konu</label>
    <select name="konu" class="form-select" v-model="form.subject">
        <option value="">Seçiniz...</option>
        <option value="Destek">Destek</option>
        <option value="Öneri">Öneri</option>
        <option value="İş Birliği">İş Birliği</option>
        <option value="Diğer">Diğer</option> 
    </select>
</div>

                    
                    <div class="mb-3">
                        <label class="form-label">Mesajınız</label>
                        <textarea name="mesaj" v-model="form.message" class="form-control" rows="4"></textarea>
                    </div>

                    
                    <div class="mb-3">
                        <label class="form-label d-block">Cinsiyet</label>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="cinsiyet" value="Erkek" v-model="form.gender">
                            <label class="form-check-label">Erkek</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="cinsiyet" value="Kadın" v-model="form.gender">
                            <label class="form-check-label">Kadın</label>
                        </div>
                    </div>

                    <div class="d-grid gap-2 mt-4">
                        <button type="button" class="btn btn-primary" onclick="validateJS()">JS ile Gönder</button>
                        <button type="submit" class="btn btn-success">Vue.js ile Gönder</button>
                        <button type="reset" class="btn btn-outline-secondary" @click="resetForm">Temizle</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    
    <script>
       
        function validateJS() {
            const name = document.getElementById('adSoyad').value;
            const email = document.getElementById('email').value;
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (name === "" || email === "") {
                alert("Lütfen tüm alanları doldurun! (JS Kontrolü)");
                return false;
            }
            if (!emailPattern.test(email)) {
                alert("Geçersiz e-posta formatı! (JS Kontrolü)");
                return false;
            }
            
            alert("JS Kontrolü Başarılı! Form PHP'ye gönderiliyor...");
            document.getElementById('contactForm').submit();
        }

        
        const { createApp } = Vue;
        createApp({
            data() {
                return {
                    form: { name: '', email: '', subject: '', message: '', gender: '' },
                    errors: { name: null, email: null }
                }
            },
            methods: {
                validateVue(e) {
                    this.errors = { name: null, email: null };
                    let isValid = true;

                    if (!this.form.name) {
                        this.errors.name = "İsim alanı boş bırakılamaz!";
                        isValid = false;
                    }
                    if (!this.form.email.includes('@')) {
                        this.errors.email = "Geçerli bir e-posta giriniz!";
                        isValid = false;
                    }

                    if (!isValid) {
                        e.preventDefault(); 
                    } else {
                        alert("Vue.js Kontrolü Başarılı!");
                    }
                },
                resetForm() {
                    this.form = { name: '', email: '', subject: '', message: '', gender: '' };
                    this.errors = { name: null, email: null };
                }
            }
        }).mount('#app');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
