<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Web Projem</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body {
            
            background: #f4f4f9; 
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
        }
        .login-card {
            
            background: #ffffff;
            padding: 50px;
            border-radius: 12px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 1px solid #e0e0e0;
        }
        .login-card h2 {
            
            color: #333;
            margin-bottom: 30px;
            font-weight: 700;
        }
        .form-control {
            
            background: #f8f9fa;
            border: 1px solid #ddd;
            color: #333;
            padding: 12px;
            margin-bottom: 20px;
        }
        .form-control:focus {
           
            background: #fff;
            color: #333;
            border-color: #555;
            box-shadow: none;
        }
        .btn-login {
            
            background: #333;
            color: #fff;
            font-weight: bold;
            padding: 12px;
            border: none;
            transition: background 0.3s ease;
        }
        .btn-login:hover {
            
            background: #555;
            color: #fff;
        }
        .nav-link-custom {
           
            color: #777;
            text-decoration: none;
            font-size: 0.9rem;
        }
        .nav-link-custom:hover {
            color: #333;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2 class="text-center">Giriş Yap</h2>
        
        <form id="loginForm" action="gonder.php" method="POST" onsubmit="return handleLogin()">
            <div class="mb-3">
                <input type="text" id="username" name="kullanici_adi" class="form-control" placeholder="Kullanıcı Adı (Örn: b2412100001@sakarya.edu.tr)">
            </div>
            <div class="mb-3">
                <input type="password" id="password" name="sifre" class="form-control" placeholder="Şifre (Öğrenci Numarası)">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-login">Oturum Aç</button>
            </div>
            <div class="text-center mt-3">
                <a href="index.html" class="nav-link-custom">Anasayfaya Dön</a>
            </div>
        </form>
    </div>

    <script>
        function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (username === "" || password === "") {
                alert("Hata: Kullanıcı adı veya şifre alanları boş bırakılamaz!");
                return false;
            }

            if (!emailPattern.test(username)) {
                alert("Hata: Geçersiz e-posta formatı!");
                return false;
            }

            if (!username.endsWith("@sakarya.edu.tr")) {
                alert("Hata: Kullanıcı adı '@sakarya.edu.tr' uzantılı olmalıdır!");
                return false;
            }

            return true;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
