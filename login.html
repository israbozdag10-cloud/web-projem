<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Web Projem</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;1,400&display=swap" rel="stylesheet">
    
    <style>
       
        :root {
            --bg-lacivert: #0a1128;       
            --bg-kart: #111f42;           
            --text-primary: #ffffff;      
            --text-muted: #a0aec0;        
            --accent-gold: #e2b659;      
            --font-sans: 'Inter', sans-serif;
            --font-serif: 'Playfair Display', serif;
        }

        body {
            background-color: var(--bg-lacivert);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-sans);
            margin: 0;
            letter-spacing: -0.02em;
        }

      
        .login-card {
            background-color: var(--bg-kart);
            padding: 50px;
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            border: 1px solid rgba(255, 255, 255, 0.03);
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.5);
        }

       
        .login-card h2 {
            color: var(--text-primary);
            margin-bottom: 5px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .login-card h2 span {
            font-family: var(--font-serif);
            font-style: italic;
            color: var(--accent-gold);
            font-weight: 600;
        }

        
        .form-control {
            background-color: rgba(10, 17, 40, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            color: var(--text-primary) !important;
            padding: 14px;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .form-control:focus {
            border-color: var(--accent-gold) !important;
            box-shadow: 0 0 10px rgba(232, 182, 89, 0.2) !important;
        }

        
        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.35) !important;
        }

       
        .btn-login {
            background-color: var(--accent-gold);
            color: var(--bg-lacivert);
            font-weight: 600;
            border: 1px solid var(--accent-gold);
            padding: 14px;
            border-radius: 8px;
            transition: all 0.3s ease;
            letter-spacing: 0.5px;
        }

        .btn-login:hover {
            background-color: transparent;
            color: var(--accent-gold);
            box-shadow: 0 5px 15px rgba(232, 182, 89, 0.2);
        }

        
        .nav-link-custom {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            transition: color 0.2s ease;
            display: inline-block;
        }

        .nav-link-custom:hover {
            color: var(--accent-gold);
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <h2>Giriş <span>Yap</span></h2>
            <p class="text-muted small mt-2" style="font-size: 0.85rem;">Lütfen öğrenci kimlik bilgilerinizle oturum açın.</p>
        </div>
        
        <form id="loginForm" action="gonder.php" method="POST" onsubmit="return handleLogin()">
            
            <div class="mb-3">
                <input type="text" id="username" name="kullanici_adi" class="form-control" 
                       placeholder="Kullanıcı Adı (b251210047@sakarya.edu.tr)">
            </div>
            
            <div class="mb-4">
                <input type="password" id="password" name="sifre" class="form-control" 
                       placeholder="Şifre (Öğrenci Numarası)">
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-login">Oturum Aç</button>
            </div>
            
            <div class="text-center mt-4">
                <a href="index.html" class="nav-link-custom">← Anasayfaya Dön</a>
            </div>
        </form>
    </div>

    <script>
        function handleLogin() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            if (username === "" || password === "") {
                alert("Hata: Kullanıcı adı veya şifre alanları boş bırakılamaz!");
                return false;
            }

            if (!emailPattern.test(username)) {
                alert("Hata: Geçersiz e-posta formatı!");
                return false;
            }

            if (!username.endsWith("@sakarya.edu.tr")) {
                alert("Hata: Kullanıcı adı '@sakarya.edu.tr' uzantılı olmalıdır!");
                return false;
            }

            return true;
        }
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
