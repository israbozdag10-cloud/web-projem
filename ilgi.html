<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İlgi Alanlarım - Geniş Katalog</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        body { 
            background-color: #0a0a0a; 
            color: #fff; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .navbar { 
            background-color: rgba(0,0,0,0.9) !important;
            border-bottom: 3px solid #e50914; 
        }
        .netflix-card {
            transition: transform 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            border: none;
            background-color: #141414;
            border-radius: 4px;
            height: 100%;
        }
        .netflix-card:hover {
            transform: scale(1.08);
            box-shadow: 0 15px 30px rgba(0,0,0,0.8);
            z-index: 10;
        }
        .card-img-top {
            height: 380px;
            object-fit: cover;
        }
        .btn-netflix {
            background-color: #e50914;
            color: white;
            font-weight: 600;
            border-radius: 2px;
        }
        .btn-netflix:hover {
            background-color: #b20710;
            color: white;
        }
        .lang-badge {
            position: absolute;
            top: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            padding: 2px 8px;
            font-size: 0.7rem;
            border: 1px solid #444;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top">
        <div class="container">
            <a class="navbar-brand text-danger fw-bold fs-3" href="index.html">NETFLIX-API</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-uppercase small fw-bold">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html" style="color: #e50914 !important;">Hakkında</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="cv.html" style="color: #e50914 !important;">CV</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="sehrim.html" style="color: #e50914 !important;">Şehrim</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="mirasimiz.html" style="color: #e50914 !important;">Mirasımız</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ilgi.html" style="color: #e50914 !important;">İlgi Alanlarım</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="iletisim.html" style="color: #e50914 !important;">İletişim</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="login.html" style="color: #e50914 !important;">Login</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <h2 class="text-white mb-4 fw-bold">Dizi & Film Arşivim</h2>
        
        <div id="loader" class="text-center py-5">
            <div class="spinner-border text-danger" role="status"></div>
            <p class="mt-2 text-secondary">Global sunuculardan veriler çekiliyor...</p>
        </div>

        <div id="media-grid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">
         
        </div>
    </div>

    <script>
       
        const genişListe = [
            "All of Us Are Dead", "Sherlock", "The Witcher", "Jujutsu Kaisen", 
            "Dark", "Bird Box", "Purple Hearts", "Squid Game", 
            "Money Heist", "Wednesday", "The Sandman", "You", 
            "Arcane", "Peaky Blinders", "Mindhunter", "Beef"
        ];

        async function loadArchive() {
            const grid = document.getElementById('media-grid');
            const loader = document.getElementById('loader');

            try {
                for (const title of genişListe) {
                    const response = await fetch(`https://api.tvmaze.com/singlesearch/shows?q=${title}`);
                    
                    if (response.ok) {
                        const data = await response.json();
                        
                        const itemHtml = `
                            <div class="col">
                                <div class="card netflix-card position-relative">
                                    <span class="lang-badge text-uppercase">${data.language}</span>
                                    <img src="${data.image ? data.image.original : 'https://via.placeholder.com/400x570'}" class="card-img-top" alt="${data.name}">
                                    <div class="card-body d-flex flex-column">
                                        <h6 class="card-title fw-bold mb-1">${data.name}</h6>
                                        <div class="text-danger small mb-2" style="font-size: 0.75rem;">
                                            ${data.genres.join(' • ')}
                                        </div>
                                        <p class="card-text text-secondary" style="font-size: 0.8rem;">
                                            ${data.summary ? data.summary.replace(/<[^>]*>/g, '').substring(0, 85) : 'Özet bulunamadı.'}...
                                        </p>
                                        <a href="${data.url}" target="_blank" class="btn btn-netflix btn-sm mt-auto">Detaylar</a>
                                    </div>
                                </div>
                            </div>
                        `;
                        grid.innerHTML += itemHtml;
                    }
                }
                loader.style.display = 'none';
            } catch (err) {
                loader.innerHTML = "<p class='text-danger'>Bağlantı hatası oluştu.</p>";
            }
        }

        window.onload = loadArchive;
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
